name: owlet-rtsp
services:
  owlet-rtsp:
    build: .
    image: owlet-rtsp:local
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
      - "${RTSP_PORT:-8554}:${RTSP_PORT:-8554}"
      - "${HLS_PORT:-8888}:${HLS_PORT:-8888}"
      - "${WEBRTC_PORT:-8889}:${WEBRTC_PORT:-8889}"
      - "8189:8189/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      RTSP_USER: ${RTSP_USER:-}
      RTSP_PASS: ${RTSP_PASS:-}
      API_PORT: ${API_PORT:-8000}
      RTSP_PORT: ${RTSP_PORT:-8554}
      HLS_PORT: ${HLS_PORT:-8888}
      WEBRTC_PORT: ${WEBRTC_PORT:-8889}
      OWLET_TUTK_BIN: ${OWLET_TUTK_BIN:-owlet-tutk}
      OWLET_API_KEY: ${OWLET_API_KEY:-}
      OWLET_ACCOUNTS_BASE: ${OWLET_ACCOUNTS_BASE:-https://accounts.owletdata.com}
      OWLET_KMS_BASE: ${OWLET_KMS_BASE:-https://camera-kms.owletdata.com}
      OWLET_PACKAGE: ${OWLET_PACKAGE:-com.owletcare.sleep}
      OWLET_CERT: ${OWLET_CERT:-2A3BC26DB0B8B0792DBE28E6FFDC2598F9B12B74}
      MEDIAMTX_BIN: ${MEDIAMTX_BIN:-/usr/local/bin/mediamtx}
      MEDIAMTX_API: ${MEDIAMTX_API:-127.0.0.1:9997}
    volumes:
      - owlet-data:/data
volumes:
  owlet-data:
